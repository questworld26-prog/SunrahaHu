[project]
name = "sunrahahu"
version = "1.0.0"
description = "Fast background macOS voice dictation using Whisper Large-V3-Turbo"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mlx-whisper>=0.4.3",
    "numpy>=2.5.4",
    "pynput>=1.8.2",
    "pyobjc-framework-quartz>=12.2.2",
    "rumps>=0.4.0",
    "sounddevice>=0.5.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.17.0",
    "ruff>=0.9.0",
]

[project.scripts]
sunrahahu = "sunrahahu.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sunrahahu"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "stress: mark test as a stress test",
]

[tool.ruff]
target-version = "py313"
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "N",     # pep8-naming
    "SIM",   # flake8-simplify
    "ASYNC", # flake8-async
    "C901",  # mccabe complexity
]
ignore = [
    "E501", # line length handled by formatter
    "B008",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
